# Theme metadata
name = "Dauparas"

[light]
  # Primary — matches dauparas.github.io's theme-color (#006400 / darkgreen)
  primary = "#006400"

  # Menu
  menu_primary = "#006400"
  menu_text = "#fff"
  menu_text_active = "#ffffff"
  menu_title = "#fff"

  # Links
  link = "#006400"
  link_hover = "#004d00"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(247, 247, 247)"

[dark]
  # Primary
  primary = "#4caf50"

  # Menu
  menu_primary = "rgb(20, 22, 34)"
  menu_text = "rgba(255,255,255,0.6)"
  menu_text_active = "rgba(255,255,255,1)"
  menu_title = "#fff"

  # Home sections
  home_section_odd = "hsla(231, 15%, 18%, 1)"
  home_section_even = "hsla(231, 15%, 16%, 1)"
