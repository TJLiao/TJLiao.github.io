# Theme metadata
name = "Dauparas"

[light]
  # Primary — tab20 淺紫色
  primary = "#c5b0d5"

  # Menu
  menu_primary = "#000000"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Links — tab20 淺綠 / 深綠
  link = "#98df8a"
  link_hover = "#2ca02c"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(247, 247, 247)"

[dark]
  # Primary
  primary = "#c5b0d5"

  # Menu
  menu_primary = "#000000"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Links
  link = "#98df8a"
  link_hover = "#2ca02c"

  # Home sections
  home_section_odd = "hsla(231, 15%, 18%, 1)"
  home_section_even = "hsla(231, 15%, 16%, 1)"
