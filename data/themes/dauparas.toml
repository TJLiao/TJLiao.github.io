# Theme metadata
name = "Dauparas"

[light]
  # Primary — 深綠色
  primary = "#004d00"

  # Menu
  menu_primary = "#000000"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Links — 深紫色 / 黑色 (hover)
  link = "#684884"
  link_hover = "#000000"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(247, 247, 247)"

[dark]
  # Primary
  primary = "#004d00"

  # Menu
  menu_primary = "#000000"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Links
  link = "#684884"
  link_hover = "#000000"

  # Home sections
  home_section_odd = "hsla(231, 15%, 18%, 1)"
  home_section_even = "hsla(231, 15%, 16%, 1)"
