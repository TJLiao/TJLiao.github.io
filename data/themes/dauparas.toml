# Theme metadata
name = "Dauparas"

[light]
  # Primary — tab20 深灰色
  primary = "#7f7f7f"

  # Menu
  menu_primary = "#000000"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Links — tab20 紫色 / 更深的紫色 (hover)
  link = "#9467bd"
  link_hover = "#684884"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(247, 247, 247)"

[dark]
  # Primary
  primary = "#7f7f7f"

  # Menu
  menu_primary = "#000000"
  menu_text = "#ffffff"
  menu_text_active = "#ffffff"
  menu_title = "#ffffff"

  # Links
  link = "#9467bd"
  link_hover = "#684884"

  # Home sections
  home_section_odd = "hsla(231, 15%, 18%, 1)"
  home_section_even = "hsla(231, 15%, 16%, 1)"
